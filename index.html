<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Despiece Sillones</title>
<style>
    * { box-sizing: border-box; }
    body { 
        font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        margin: 0; 
        padding: 8px; 
        background: #fff; 
        color: #000; 
    }
    h2 { 
        font-size: 16px; 
        margin: 15px 0 5px 0; 
        padding-bottom: 5px; 
        border-bottom: 1.5px solid #000; 
        text-transform: uppercase; 
    }
    table { 
        width: 100%; 
        border-collapse: collapse; 
        table-layout: fixed; 
        margin-bottom: 10px;
    }
    th, td { 
        padding: 4px 0; 
        border-bottom: 1px solid #ddd; 
    }
    th { 
        font-size: 11px; 
        color: #666; 
        text-align: left;
        font-weight: normal; 
    }
    /* Distribución de columnas */
    th:nth-child(1), td:nth-child(1) { width: 50%; padding-right: 2px; }
    th:nth-child(2), td:nth-child(2) { width: 25%; padding-right: 2px; }
    th:nth-child(3), td:nth-child(3) { width: 25%; padding-right: 2px; }
    
    /* Columna de eliminación oculta por defecto */
    .th-del, .td-del { 
        display: none; 
        width: 15%; 
        text-align: center; 
    }
    
    /* Mostrar columna de eliminación cuando el body tiene la clase 'modo-edicion' */
    body.modo-edicion th:nth-child(1), body.modo-edicion td:nth-child(1) { width: 40%; }
    body.modo-edicion th:nth-child(2), body.modo-edicion td:nth-child(2) { width: 23%; }
    body.modo-edicion th:nth-child(3), body.modo-edicion td:nth-child(3) { width: 22%; }
    body.modo-edicion .th-del, body.modo-edicion .td-del { display: table-cell; }

    input { 
        width: 100%; 
        border: none; 
        background: #f4f4f4; 
        padding: 8px 4px; 
        font-size: 13px; 
        color: #000; 
        outline: none; 
        border-radius: 2px;
    }
    input:focus { background: #e0e0e0; }
    
    .btn-add {
        background: #eee;
        color: #000;
        border: 1px dashed #999;
        padding: 10px;
        width: 100%;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 10px;
    }
    .btn-del {
        background: none;
        border: none;
        color: #d00;
        font-size: 16px;
        font-weight: bold;
        padding: 5px;
        cursor: pointer;
    }
    .btn-accion { 
        width: 100%; 
        margin-top: 10px; 
        padding: 15px; 
        color: #fff; 
        border: none; 
        font-size: 14px; 
        text-transform: uppercase; 
        font-weight: bold;
        cursor: pointer;
    }
    .btn-edit { background: #333; }
    .btn-reset { background: #000; margin-bottom: 20px; }
</style>
</head>
<body>

<h2>MODELO A (1 CUERPO)</h2>
<table>
    <thead><tr><th>Pieza</th><th>Medida</th><th>Cant.</th><th class="th-del"></th></tr></thead>
    <tbody id="tbody_A"></tbody>
</table>
<button class="btn-add" onclick="agregarFila('A')">+ Agregar pieza</button>

<h2>MODELO G (2 CUERPOS)</h2>
<table>
    <thead><tr><th>Pieza</th><th>Medida</th><th>Cant.</th><th class="th-del"></th></tr></thead>
    <tbody id="tbody_G"></tbody>
</table>
<button class="btn-add" onclick="agregarFila('G')">+ Agregar pieza</button>

<button class="btn-accion btn-edit" id="btnEdit" onclick="toggleEdicion()">Editar (Mostrar Eliminar)</button>
<button class="btn-accion btn-reset" onclick="restablecer()">Restablecer Originales</button>

<script>
    // Valores por defecto extraídos de tus capturas
    const datosBase = {
        A: [
            {p: "Patas delanteras", m: "65 cm", c: "2"},
            {p: "Patas traseras Base", m: "100 cm", c: "2"},
            {p: "Tablas asiento", m: "60 cm", c: "9"},
            {p: "Tablas respaldo", m: "80 cm", c: "7"},
            {p: "Transversal resp. Clavador", m: "55 cm", c: "1"},
            {p: "Apoyabrazos", m: "90 cm", c: "2"},
            {p: "Soporte apoyabrazos", m: "75 cm", c: "1"},
            {p: "Triángulo apoyabrazos", m: "20 cm", c: "2"},
            {p: "Verticales traseros", m: "80 cm", c: "2"},
            {p: "Tablas - clavos", m: "4", c: "70"}
        ],
        G: [
            {p: "Patas delanteras", m: "65 cm", c: "2"},
            {p: "Patas traseras Base", m: "100 cm", c: "3"},
            {p: "Pata intermedia", m: "X", c: "1"},
            {p: "Tablas asiento", m: "130 cm", c: "9"},
            {p: "Tablas respaldo", m: "80 cm", c: "15"},
            {p: "Transversal resp. Clavador", m: "125 cm", c: "1"},
            {p: "Apoyabrazos", m: "90 cm", c: "2"},
            {p: "Soporte apoyabrazos", m: "145 cm", c: "1"},
            {p: "Triangulo apoyabrazos", m: "20 cm", c: "2"},
            {p: "Verticales traseros", m: "80 cm", c: "2"},
            {p: "Tablas - Clavos", m: "6", c: "140"}
        ]
    };

    // Cargar datos de LocalStorage o usar los base
    let datos = JSON.parse(localStorage.getItem('sillones_data')) || JSON.parse(JSON.stringify(datosBase));

    function guardar() {
        localStorage.setItem('sillones_data', JSON.stringify(datos));
    }

    function renderizar() {
        ['A', 'G'].forEach(modelo => {
            const tbody = document.getElementById(`tbody_${modelo}`);
            tbody.innerHTML = '';
            
            datos[modelo].forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" value="${item.p}" oninput="actualizar('${modelo}', ${index}, 'p', this.value)"></td>
                    <td><input type="text" value="${item.m}" oninput="actualizar('${modelo}', ${index}, 'm', this.value)"></td>
                    <td><input type="text" value="${item.c}" oninput="actualizar('${modelo}', ${index}, 'c', this.value)"></td>
                    <td class="td-del"><button class="btn-del" onclick="eliminarFila('${modelo}', ${index})">×</button></td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    function actualizar(modelo, index, campo, valor) {
        datos[modelo][index][campo] = valor;
        guardar();
    }

    function agregarFila(modelo) {
        datos[modelo].push({p: "", m: "", c: ""});
        guardar();
        renderizar();
    }

    function eliminarFila(modelo, index) {
        // Alerta de confirmación para eliminar una fila
        if(confirm('¿Estás seguro de que quieres eliminar esta pieza del listado?')) {
            datos[modelo].splice(index, 1);
            guardar();
            renderizar();
        }
    }

    function restablecer() {
        // Alerta de confirmación para el reset
        if(confirm('¿Seguro que querés volver a los datos originales? Se borrarán todas las modificaciones y filas nuevas que hayas hecho.')) {
            datos = JSON.parse(JSON.stringify(datosBase));
            guardar();
            renderizar();
        }
    }

    function toggleEdicion() {
        document.body.classList.toggle('modo-edicion');
        const btn = document.getElementById('btnEdit');
        
        if(document.body.classList.contains('modo-edicion')) {
            btn.innerText = "Ocultar botones de eliminar";
            btn.style.background = "#666";
        } else {
            btn.innerText = "Editar (Mostrar Eliminar)";
            btn.style.background = "#333";
        }
    }

    // Iniciar renderizado al cargar
    renderizar();
</script>
</body>
</html>
